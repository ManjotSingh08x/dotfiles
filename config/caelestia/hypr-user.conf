# User custom Hyprland configuration for Caelestia (.conf fallback)

# Keybinds: Super + Space for Play/Pause
bind = Super, Space, exec, caelestia shell mpris playPause
bind = Ctrl+Super, Space, exec, caelestia shell mpris playPause

# 3 fingers: Volume control and track skipping
gesture = 3, up, dispatcher, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 10%+
gesture = 3, down, dispatcher, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
gesture = 3, left, dispatcher, exec, caelestia shell mpris next
gesture = 3, right, dispatcher, exec, caelestia shell mpris previous

# 4 fingers: Toggle music workspace (both up and down)
gesture = 4, up, dispatcher, exec, caelestia toggle music
gesture = 4, down, dispatcher, exec, caelestia toggle music
